# Identification du projet SonarQube
sonar.projectKey=Hello_DEVOPS
sonar.projectName=Hello_DEVOPS
sonar.projectVersion=1.0

# Code Java de l'application
sonar.sources=src/main/java

# Code des tests JUnit, séparé du code de l'application
sonar.tests=src/test/java

# Classes de l'application compilées par Maven
sonar.java.binaries=target/classes

# Classes des tests compilées par Maven
sonar.java.test.binaries=target/test-classes

# Rapports des résultats JUnit produits par Maven Surefire
sonar.junit.reportPaths=target/surefire-reports

# Encodage des fichiers sources
sonar.sourceEncoding=UTF-8

# Rapport de couverture produit par JaCoCo.
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
