
# Identification du projet SonarQube
sonar.projectKey=hello-devops
sonar.projectName=Hello_DEVOPS
sonar.projectVersion=1.0

# Fichiers à analyser
sonar.sources=.

# Fichiers Java compilés
sonar.java.binaries=.

# Exclure les fichiers compilés de l'analyse des sources
sonar.exclusions=**/*.class

# Encodage
sonar.sourceEncoding=UTF-8

