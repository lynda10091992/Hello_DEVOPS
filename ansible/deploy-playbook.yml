---
- name: Déployer Hello_DEVOPS
  hosts: backend
  gather_facts: false

  tasks:
    # Vérifier le secret avant toute modification du backend.
    - name: Vérifier le mot de passe fourni par Jenkins
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'POSTGRES_APP_PASSWORD') | length > 0
        fail_msg: "Le secret PostgreSQL manque dans Jenkins."
      no_log: true

    - name: Créer le dossier de déploiement
      ansible.builtin.file:
        path: /home/adm1/hello-devops
        state: directory
        mode: "0755"

    - name: Copier le fichier Compose
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compose.yaml"
        dest: /home/adm1/hello-devops/compose.yaml
        mode: "0644"

    # Créer le fichier attendu par Compose avant de démarrer le conteneur.
    - name: Installer le mot de passe PostgreSQL
      become: true
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.env', 'POSTGRES_APP_PASSWORD') }}"
        dest: /home/adm1/hello-devops/postgres-password.txt
        owner: adm1
        mode: "0600"
      no_log: true

    - name: Lancer Hello_DEVOPS avec Docker Compose
      become: true
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /home/adm1/hello-devops
      environment:
        IMAGE_TAG: "{{ image_tag | default('build-13') }}"
