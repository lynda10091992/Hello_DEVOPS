services:
  hello-devops:
    image: "zegrour/hello-devops:${IMAGE_TAG:-build-13}"

    # Port du backend : 8082 ; port dans le conteneur : 8080.
    ports:
      - "8082:8080"

    environment:
      SERVER_PORT: "8080"
      SERVER_ADDRESS: "0.0.0.0"

      # Connexion à PostgreSQL sur Devmaster.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://192.168.84.10:5432/formation_devops"
      SPRING_DATASOURCE_USERNAME: "hello_devops_app"
      SPRING_SQL_INIT_MODE: "never"

      # Chargement du mot de passe depuis le fichier secret.
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"

    secrets:
      - source: postgres_password
        target: spring.datasource.password

secrets:
  postgres_password:
    file: ./postgres-password.txt
